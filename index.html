<!DOCTYPE html>
<html>
<head>
    <title>Four Websites in Frames</title>
</head>

<body>
    <table width="100%" height="600" border="1">
        <tr>
            <td width="50%" height="300">
                <iframe src="https://www.google.com"
                width="100%" height="300">
                </iframe>
            </td>

            <td width="50%" height="300">
                <iframe src="https://www.pinterest.com/"
                width="100%" height="300">
                </iframe>
            </td>
        </tr>

        <tr>
            <td width="50%" height="300">
                <iframe src="https://www.github.com"
                width="100%" height="300">
                </iframe>
            </td>

            <td width="50%" height="300">
                <iframe src="https://www.openai.com"
                width="100%" height="300">
                </iframe>
            </td>
        </tr>
    </table>
</body>
</html>
